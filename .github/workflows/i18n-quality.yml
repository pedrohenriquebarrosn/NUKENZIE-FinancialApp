name: NuKenzie bilingual preview quality
on:
  push:
    branches: [review/i18n-pt-en-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node --test tests/finance.test.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nukenzie-ui-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
