name: NuKenzie bilingual preview quality
on:
  push:
    branches: [review/i18n-pt-en-20261013]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund --package-lock=false
      - run: node --test tests/finance.test.mjs
      - run: npm run build
